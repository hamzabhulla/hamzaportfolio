name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Security, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install reproducibly
        run: npm ci

      - name: Check known dependency advisories
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build production app
        env:
          NEXT_PUBLIC_SITE_URL: https://portfolio.example.test
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ci-verification-token
          NEXT_PUBLIC_CONTACT_EMAIL: ci-contact@example.test
        run: npm run build

      - name: Smoke-test generated production routes
        env:
          NEXT_PUBLIC_SITE_URL: https://portfolio.example.test
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ci-verification-token
          NEXT_PUBLIC_CONTACT_EMAIL: ci-contact@example.test
        run: npm run smoke-test
